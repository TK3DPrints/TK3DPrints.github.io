<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK 3D Prints - Shop</title>

<style>
body{
    margin:0;
    padding:40px;
    font-family:Segoe UI,sans-serif;
    background:#0b1020;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:10px;
}

p{
    color:#aaa;
}

.card{
    background:#141a33;
    border-radius:12px;
    padding:20px;
    max-width:500px;
    margin-top:20px;
}

.main-image{
    width:100%;
    height:300px;
    object-fit:contain;
    background:#0f172a;
    border-radius:10px;
}

.thumbs{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.thumbs img{
    width:60px;
    height:60px;
    object-fit:cover;
    cursor:pointer;
    border-radius:8px;
    border:2px solid transparent;
}

.thumbs img.active{
    border-color:#4fd1c5;
}

.price{
    color:#4fd1c5;
    font-size:1.2rem;
    font-weight:bold;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:10px 16px;
    border:none;
    border-radius:999px;
    background:#4fd1c5;
    color:#000;
    cursor:pointer;
    font-weight:600;
}
</style>

</head>
<body>

<div class="container">

<h1>TK 3D Prints Shop</h1>

<p>Ready-made and custom 3D prints.</p>

<div class="card">

<img
 id="mainImage-1.png

<div class="thumbs">

<img
 src="/images/radio-mount-1.png"
 class="active"
 onclick="changeImage(this)">

<img
 src="/images/radio-Single DIN Radio Mount</h2>

<div class="price">$45.00</div>

<p>
Custom under-dash mount designed to fit a standard single-DIN radio in classic Ford interiors.
</p>

<button onclick="location.href='quote.html?product=Under-Dash%20Single%20DIN%20Radio%20Mount'">
Order This Print
</button>

</div>

</div>

<script>
function changeImage(img){

document.getElementById("mainImage").src = img.src;

document.querySelectorAll(".thumbs img")
.forEach(i => i.classList.remove("active"));

img.classList.add("active");

}
</script>

</body>
</html>
