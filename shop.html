<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK 3D Prints - Shop</title>

<style>
:root {
  --bg: #0b1020;
  --card-bg: #141a33;
  --accent: #4fd1c5;
  --accent-soft: rgba(79,209,197,.15);
  --text-main: #f7fafc;
  --text-muted: #a0aec0;
  --border-soft: #2d3748;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Segoe UI, sans-serif;
  background: radial-gradient(circle at top,#1a202c 0,#0b1020 55%,#05060b 100%);
  color: var(--text-main);
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 20px;
}

header {
  margin-bottom: 24px;
}

header h1 {
  margin: 0;
  font-size: 2rem;
}

header p {
  margin-top: 8px;
  color: var(--text-muted);
}

.filters {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filters-left {
  display: flex;
  gap: 8px;
}

.filter-btn {
  background: rgba(15,23,42,.9);
  color: var(--text-muted);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}

.filter-btn.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.search-input {
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  background: rgba(15,23,42,.9);
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
  gap: 20px;
}

.card {
  background: rgba(15,23,42,.95);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

.card-img {
  height: 320px;
  background: #08111f;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.card-content {
  padding: 14px;
}

.thumbs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.thumbs img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  cursor: pointer;
  border-radius: 8px;
  border: 2px solid transparent;
}

.thumbs img.active {
  border-color: var(--accent);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.card-title {
  font-size: 1.1rem;
  font-weight: 600;
}

.card-price {
  color: var(--accent);
  font-weight: bold;
}

.pill {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-size: .8rem;
}

.card-desc {
  margin-top: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}

.card-footer {
  margin-top: 14px;
  text-align: right;
}
